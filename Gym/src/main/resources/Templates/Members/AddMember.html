<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Member - GymFit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary-color: #475569;
            --accent-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Horizontal Form Styling */
        .form-horizontal {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .form-section {
            grid-column: span 3;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .form-section h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: var(--light-bg);
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .form-help {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .form-error {
            font-size: 0.875rem;
            color: var(--danger-color);
            margin-top: 0.25rem;
        }

        .required::after {
            content: '*';
            color: var(--danger-color);
            margin-left: 0.25rem;
        }

        .card-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-secondary {
            background-color: var(--light-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .alert {
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
        }

        /* Responsive grid */
        @media (max-width: 992px) {
            .form-horizontal {
                grid-template-columns: repeat(2, 1fr);
            }
            .form-section {
                grid-column: span 2;
            }
        }

        @media (max-width: 768px) {
            .form-horizontal {
                grid-template-columns: 1fr;
            }
            .form-section {
                grid-column: span 1;
            }
        }

        /* Error styling */
        .is-invalid {
            border-color: var(--danger-color);
        }

        .is-invalid:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Add New Member</h2>
                <a href="/admin/members" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    Back to Members
                </a>
            </div>
            
            <!-- Display success message if available -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i>
                <span th:text="${successMessage}">Member added successfully!</span>
            </div>
            
            <!-- Display error message if available -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMessage}">Error adding member!</span>
            </div>
            
            <div class="card-body">
                <form id="addMemberForm">
                    <!-- Personal Information Section -->
                    <div class="form-section">
                        <h3>Personal Information</h3>
                    </div>
                    
                    <!-- Horizontal Layout Start -->
                    <div class="form-horizontal">
                        <!-- First Name -->
                        <div class="form-group">
                            <label for="firstName" class="form-label required">First Name</label>
                            <input type="text" id="firstName" name="firstName" class="form-control" required>
                        </div>
                        
                        <!-- Last Name -->
                        <div class="form-group">
                            <label for="lastName" class="form-label required">Last Name</label>
                            <input type="text" id="lastName" name="lastName" class="form-control" required>
                        </div>
                        
                        <!-- Email -->
                        <div class="form-group">
                            <label for="email" class="form-label required">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                        
                        <!-- Phone -->
                        <div class="form-group">
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control">
                        </div>
                        
                        <!-- Date of Birth -->
                        <div class="form-group">
                            <label for="dateOfBirth" class="form-label required">Date of Birth</label>
                            <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control" required>
                            <div class="form-help">Member must be at least 16 years old</div>
                        </div>
                        
                        <!-- Status -->
                        <div class="form-group">
                            <label for="status" class="form-label required">Status</label>
                            <select id="status" name="status" class="form-control" required>
                                <option value="ACTIVE" selected>Active</option>
                                <option value="SUSPENDED">Suspended</option>
                                <option value="CANCELED">Canceled</option>
                            </select>
                        </div>
                        
                        <!-- Address -->
                        <div class="form-group">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" id="address" name="address" class="form-control">
                        </div>
                        
                        <!-- Membership Information Section -->
                        <div class="form-section">
                            <h3>Membership Information</h3>
                        </div>
                        
                        <!-- Barcode -->
                        <div class="form-group">
                            <label for="barcode" class="form-label">Barcode</label>
                            <input type="text" id="barcode" name="barcode" class="form-control">
                            <div class="form-help">Leave empty to generate automatically</div>
                        </div>
                        
                        <!-- Join Date -->
                        <div class="form-group">
                            <label for="joinDate" class="form-label required">Join Date</label>
                            <input type="date" id="joinDate" name="joinDate" class="form-control" required>
                        </div>
                        
                        <!-- Membership Start Date -->
                        <div class="form-group">
                            <label for="membershipStart" class="form-label required">Membership Start Date</label>
                            <input type="date" id="membershipStart" name="membershipStart" class="form-control" required>
                        </div>
                        
                        <!-- Membership End Date -->
                        <div class="form-group">
                            <label for="membershipEnd" class="form-label required">Membership End Date</label>
                            <input type="date" id="membershipEnd" name="membershipEnd" class="form-control" required>
                        </div>
                        
                        <!-- Payment Method -->
                        <div class="form-group">
                            <label for="paymentMethod" class="form-label">Payment Method</label>
                            <select id="paymentMethod" name="paymentMethod" class="form-control">
                                <option value="">Select Payment Method</option>
                                <option value="CREDIT_CARD">Credit Card</option>
                                <option value="DEBIT_CARD">Debit Card</option>
                                <option value="CASH">Cash</option>
                            </select>
                        </div>
                        
                        <!-- Has Trainer -->
                        <div class="form-group">
                            <label for="hasTrainer" class="form-label">Has Trainer</label>
                            <select id="hasTrainer" name="hasTrainer" class="form-control">
                                <option value="false" selected>No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>
                        
                        <!-- Trainer Selection (Shows/hides based on hasTrainer) -->
                        <div class="form-group" id="trainerSelectGroup" style="display: none;">
                            <label for="trainerId" class="form-label">Select Trainer</label>
                            <select id="trainerId" name="trainerId" class="form-control">
                                <option value="">Select Trainer</option>
                                <!-- This will be populated by JavaScript using API data -->
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="card-footer">
                <button type="button" class="btn btn-secondary" onclick="window.location.href = '/admin/members'">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveMember()">Save Member</button>
            </div>
        </div>
    </div>
    
    <script>
        // Set default dates
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('joinDate').value = today;
            document.getElementById('membershipStart').value = today;
            
            // Set membership end date to 30 days from today
            const endDate = new Date();
            endDate.setDate(endDate.getDate() + 30);
            document.getElementById('membershipEnd').value = endDate.toISOString().split('T')[0];
            
            // Bind hasTrainer dropdown to show/hide trainer selection
            document.getElementById('hasTrainer').addEventListener('change', function() {
                const trainerSelectGroup = document.getElementById('trainerSelectGroup');
                trainerSelectGroup.style.display = this.value === 'true' ? 'block' : 'none';
                
                if (this.value === 'true') {
                    fetchTrainers();
                }
            });
        });
        
        // Fetch trainers from API
        function fetchTrainers() {
            fetch('/api/members/all')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch trainers');
                    }
                    return response.json();
                })
                .then(trainers => {
                    const trainerSelect = document.getElementById('trainerId');
                    
                    // Clear existing options
                    while (trainerSelect.options.length > 1) {
                        trainerSelect.remove(1);
                    }
                    
                    // Add trainers to dropdown
                    trainers.forEach(trainer => {
                        const option = document.createElement('option');
                        option.value = trainer.trainerId;
                        option.textContent = `${trainer.firstName} ${trainer.lastName} - ${trainer.specialization || 'General'}`;
                        trainerSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error fetching trainers:', error);
                    alert('Failed to load trainers. Please try again.');
                });
        }
        
        // Save member
        function saveMember() {
            // Validate form
            const form = document.getElementById('addMemberForm');
            if (!validateForm()) {
                return;
            }
            
            // Collect form data
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phoneNumber: document.getElementById('phoneNumber').value || null,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                status: document.getElementById('status').value,
                address: document.getElementById('address').value || null,
                barcode: document.getElementById('barcode').value || null,
                joinDate: document.getElementById('joinDate').value,
                membershipStart: document.getElementById('membershipStart').value,
                membershipEnd: document.getElementById('membershipEnd').value,
                paymentMethod: document.getElementById('paymentMethod').value || null,
                hasTrainer: document.getElementById('hasTrainer').value === 'true',
                trainerId: document.getElementById('hasTrainer').value === 'true' ? 
                           document.getElementById('trainerId').value || null : null
            };
            
            // Send API request
            fetch('/api/members', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to create member');
                }
                return response.json();
            })
            .then(data => {
                // Redirect to members list with success message
                window.location.href = '/admin/members?success=Member created successfully';
            })
            .catch(error => {
                console.error('Error creating member:', error);
                alert('Failed to create member. Please check the form and try again.');
            });
        }
        
        // Validate form
        function validateForm() {
            const requiredFields = [
                'firstName', 'lastName', 'email', 'dateOfBirth', 
                'status', 'joinDate', 'membershipStart', 'membershipEnd'
            ];
            
            let isValid = true;
            
            // Check required fields
            requiredFields.forEach(field => {
                const input = document.getElementById(field);
                if (!input.value.trim()) {
                    input.classList.add('is-invalid');
                    isValid = false;
                } else {
                    input.classList.remove('is-invalid');
                }
            });
            
            // Check email format
            const emailInput = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailInput.value && !emailRegex.test(emailInput.value)) {
                emailInput.classList.add('is-invalid');
                isValid = false;
            }
            
            // Ensure membership end date is after start date
            const startDate = new Date(document.getElementById('membershipStart').value);
            const endDate = new Date(document.getElementById('membershipEnd').value);
            
            if (endDate < startDate) {
                document.getElementById('membershipEnd').classList.add('is-invalid');
                alert('Membership end date must be after start date');
                isValid = false;
            }
            
            // Check trainer selection if hasTrainer is true
            if (document.getElementById('hasTrainer').value === 'true') {
                const trainerId = document.getElementById('trainerId').value;
                if (!trainerId) {
                    document.getElementById('trainerId').classList.add('is-invalid');
                    isValid = false;
                }
            }
            
            return isValid;
        }
    </script>
</body>
</html>
