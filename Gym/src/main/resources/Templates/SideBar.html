<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- Sidebar Fragment with its own styling -->
<div th:fragment="sidebar">
    <!-- CSS for the sidebar -->
    <style>
        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--card-bg, #ffffff);
            position: fixed;
            left: 0;
            top: 0;
            box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06));
            padding: 1.5rem;
            z-index: 100;
            transition: var(--transition, all 0.3s ease);
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-color, #2563eb);
            margin-right: 0.5rem;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary, #1e293b);
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.875rem 1rem;
            color: var(--text-secondary, #64748b);
            text-decoration: none;
            border-radius: var(--radius-md, 0.5rem);
            transition: var(--transition, all 0.3s ease);
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--primary-color, #2563eb);
            color: white;
            transform: translateX(5px);
            box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06));
        }

        .nav-link i {
            font-size: 1.25rem;
            margin-right: 1rem;
            min-width: 24px;
            text-align: center;
        }

        .nav-link span {
            font-weight: 500;
        }

        /* Responsive sidebar */
        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
            }

            .sidebar-header h2,
            .nav-link span {
                display: none;
            }

            .nav-link i {
                margin-right: 0;
            }

            .main-container {
                margin-left: 80px;
            }
        }
    </style>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo"><i class="fas fa-dumbbell"></i></div>
            <h2>GymFit</h2>
        </div>
        <ul class="nav-list">
            <li class="nav-item">
                <a href="/home" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/members" class="nav-link">
                    <i class="fas fa-users"></i>
                    <span>Members</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/employees" class="nav-link">
                    <i class="fas fa-users-cog"></i>
                    <span>Staff</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/classes" class="nav-link">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Classes</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/trainers" class="nav-link">
                    <i class="fas fa-user-tie"></i>
                    <span>Trainers</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/departments"class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Deparments</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/plans" class="nav-link">
                    <i class="fas fa-tags"></i>
                    <span>Membership Plans</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/payments" class="nav-link">
                    <i class="fas fa-credit-card"></i>
                    <span>Payments</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/reports" class="nav-link">
                    <i class="fas fa-chart-bar"></i>
                    <span>Reports</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/settings" class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
