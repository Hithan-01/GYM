<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gym Management System - Admin Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .dashboard-card {
            margin: 20px;
        }
        .customer-info {
            margin: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: none; /* Hide initially */
        }
        .customer-photo {
            width: 150px;
            height: 150px;
            border-radius: 75px; /* Make it circular */
            object-fit: cover; /* Ensure image covers the area */
        }
        .members-table {
            display: none; /* Hide members table initially */
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mt-4">Gym Management System</h1>
    
    <div class="row">
        <!-- Dashboard Cards -->
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-header">
                    <h5>Manage Members</h5>
                </div>
                <div class="card-body">
                    <a th:href="@{/admin/members}" class="btn btn-primary">View Members</a>
                    <a th:href="@{/admin/members/add}" class="btn btn-secondary">Add Member</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-header">
                    <h5>Manage Payments</h5>
                </div>
                <div class="card-body">
                    <a th:href="@{/admin/payments}" class="btn btn-primary">View Payments</a>
                    <a th:href="@{/admin/payments/add}" class="btn btn-secondary">Add Payment</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-header">
                    <h5>Manage Attendance</h5>
                </div>
                <div class="card-body">
                    <a th:href="@{/admin/attendance}" class="btn btn-primary">View Attendance</a>
                    <a th:href="@{/admin/attendance/add}" class="btn btn-secondary">Add Attendance</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Customer Scan Section -->
    <h2 class="mt-4">Scan Membership or Search</h2>
    
    <!-- Search Bar for Member Lookup -->
    <input type="text" id="searchBar" placeholder="Search by Name or Email" class="form-control" oninput="searchMember()">
    
    <!-- Membership ID Input for Scanning -->
    <input type="text" id="membershipId" placeholder="Enter Membership ID" class="form-control mt-2" oninput="displayCustomerInfo()">
    
    <div id="customerInfo" class="customer-info">
        <img id="customerPhoto" class="customer-photo" src="" alt="Customer Photo">
        <h3 id="customerName"></h3>
        <p id="paymentStatus"></p>
        <button id="registerAttendanceBtn" class="btn btn-success" onclick="registerAttendance()" style="display:none;">Register Attendance</button>
    </div>

<script>
    // Mock data for demonstration; replace with actual data from your backend
    const customers = {
        "12345": {name: "John Doe", photo: "path/to/photo.jpg", paid: "PAID"},
        "67890": {name: "Jane Smith", photo: "path/to/photo2.jpg", paid: "UNPAID"}
    };

    function displayCustomerInfo() {
        const membershipId = document.getElementById("membershipId").value;
        const customerInfoDiv = document.getElementById("customerInfo");
        const customerName = document.getElementById("customerName");
        const customerPhoto = document.getElementById("customerPhoto");
        const paymentStatus = document.getElementById("paymentStatus");
        const registerAttendanceBtn = document.getElementById("registerAttendanceBtn");

        if (customers[membershipId]) {
            const customer = customers[membershipId];
            customerName.innerText = customer.name;
            customerPhoto.src = customer.photo;
            paymentStatus.innerText = `Payment Status: ${customer.paid}`;
            customerInfoDiv.style.display = "block"; // Show the customer info
            registerAttendanceBtn.style.display = "inline-block"; // Show the attendance button
        } else {
            customerInfoDiv.style.display = "none"; // Hide if not found
            registerAttendanceBtn.style.display = "none"; // Hide attendance button
        }
    }

    function searchMember() {
        const searchTerm = document.getElementById("searchBar").value.toLowerCase();
        const customerInfoDiv = document.getElementById("customerInfo");
        const customerName = document.getElementById("customerName");
        const customerPhoto = document.getElementById("customerPhoto");
        const paymentStatus = document.getElementById("paymentStatus");
        const registerAttendanceBtn = document.getElementById("registerAttendanceBtn");

        let found = false;

        for (const memberId in customers) {
            const customer = customers[memberId];
            if (customer.name.toLowerCase().includes(searchTerm) || 
                memberId.includes(searchTerm)) {
                customerName.innerText = customer.name;
                customerPhoto.src = customer.photo;
                paymentStatus.innerText = `Payment Status: ${customer.paid}`;
                customerInfoDiv.style.display = "block"; // Show the customer info
                registerAttendanceBtn.style.display = "inline-block"; // Show attendance button
                found = true;
                break; // Stop searching once we find a match
            }
        }

        if (!found) {
            customerInfoDiv.style.display = "none"; // Hide if not found
            registerAttendanceBtn.style.display = "none"; // Hide attendance button
        }
    }

    function registerAttendance() {
        const membershipId = document.getElementById("membershipId").value;
        // Here you would typically send a request to your backend to register attendance
        alert(`Attendance registered for member ID: ${membershipId}`);
        
        // Clear the customer info and hide the card
        const customerInfoDiv = document.getElementById("customerInfo");
        customerInfoDiv.style.display = "none"; // Hide customer info
        document.getElementById("membershipId").value = ""; // Clear membership ID input
        document.getElementById("searchBar").value = ""; // Clear search bar
    }
</script>
</body>
</html>
